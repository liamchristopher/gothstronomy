name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: find web/js -name '*.test.js' -print0 | xargs -0 node --test
